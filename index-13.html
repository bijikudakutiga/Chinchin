<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chinchin Production</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#D7132B"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--r:#D7132B;--rd:#8E0A1B;--w:#fff;--p:#FFF0EF;--ink:#2B0B10;--mut:#8a6a6e;--ok:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--w:#2a1115;--p:#1c0b0e;--ink:#fff0ef;--mut:#c9a0a5}}
:root[data-theme="dark"]{--w:#2a1115;--p:#1c0b0e;--ink:#fff0ef;--mut:#c9a0a5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--p);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:auto;padding-bottom:120px;min-height:100vh}
.top{background:var(--r);color:#fff;padding:16px;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:12px;position:relative}
.top:after{content:"";position:absolute;left:18px;right:18px;bottom:7px;border-bottom:2px dashed rgba(255,255,255,.5)}
.ttl{flex:1;line-height:1.1}.ttl b{font-size:19px;font-weight:800;display:block}.ttl small{opacity:.85}
.logo{width:54px;height:54px;border-radius:14px;background:#fff;color:var(--r);font-weight:800;display:grid;place-items:center;overflow:hidden;flex:none;cursor:pointer}
.logo img{width:100%;height:100%;object-fit:contain}
.ic{background:rgba(255,255,255,.2);border:0;border-radius:99px;padding:7px 12px;color:#fff;cursor:pointer}
.v{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--w);border-radius:18px;padding:16px;margin:12px 16px;outline:2px dashed rgba(215,19,43,.28);outline-offset:-6px;box-shadow:0 3px 0 rgba(215,19,43,.18)}
.card.go{cursor:pointer;transition:transform .15s}.card.go:active{transform:scale(.97) rotate(-.4deg)}
h2,h3{margin:2px 0 6px}h2{font-size:22px;font-weight:800}.sec{margin:20px 20px 0}
p{margin:2px 0}small{color:var(--mut)}
.hero{display:flex;justify-content:space-between;align-items:center;background:var(--r);color:#fff;outline-color:rgba(255,255,255,.6)}
.hero small{color:rgba(255,255,255,.85)}
.stat{background:#fff;color:var(--r);border-radius:16px;padding:10px 14px;text-align:center;font-size:12px}.stat b{display:block;font-size:30px;line-height:1}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap;margin:12px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;scrollbar-width:none}.chips.s{padding:0 0 10px}
.chips button{flex:none;border:2px solid var(--r);background:var(--w);color:var(--r);border-radius:99px;padding:7px 14px;font-weight:600;cursor:pointer;transition:.2s}
.chips button.on{background:var(--r);color:#fff;transform:translateY(-2px)}
.btn{background:var(--r);color:#fff;border:0;border-radius:99px;padding:12px 20px;font-weight:700;cursor:pointer;flex:1;box-shadow:0 3px 0 var(--rd);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:none}.btn.o{background:var(--w);color:var(--r);border:2px solid var(--r);box-shadow:none}.btn.s{flex:none;padding:9px 16px}
.add{display:block;width:calc(100% - 32px);margin:12px 16px}
.bar{height:10px;border-radius:99px;background:var(--p);overflow:hidden;margin:10px 0 4px}
.bar span{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(45deg,var(--r) 0 8px,#f0475b 8px 16px);background-size:23px 23px;animation:mv 1s linear infinite;transition:width .5s}@keyframes mv{to{background-position:23px 0}}
.bd{font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px;border:2px solid var(--r);color:var(--r);white-space:nowrap}.bd.late{background:var(--r);color:#fff}.bd.ok{border-color:var(--ok);color:var(--ok)}
.tg{display:inline-block;background:var(--p);color:var(--r);border-radius:8px;padding:2px 8px;font-size:12px;margin:6px 4px 0 0}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(215,19,43,.25)}.it span{flex:1}.dn{text-decoration:line-through;color:var(--mut)}
.ck{width:28px;height:28px;border-radius:9px;border:2px solid var(--r);background:var(--w);color:#fff;cursor:pointer;font-weight:800;flex:none}.ck.on{background:var(--r)}.ck.pk{animation:pk .4s}@keyframes pk{50%{transform:scale(1.4) rotate(12deg)}}
.x{border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer}
input,select,textarea{width:100%;border:2px solid rgba(215,19,43,.3);border-radius:12px;padding:10px 12px;background:var(--w);margin-top:4px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--r);outline-offset:2px}
label{display:block;margin-top:10px;font-weight:600;font-size:14px}
.back{border:0;background:none;color:var(--r);font-weight:700;margin:14px 16px 0;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--w);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;box-shadow:0 -4px 20px rgba(142,10,27,.18);z-index:5}
.nav>button{border:0;background:none;color:var(--mut);font-weight:600;font-size:12px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center}.nav>button.on{color:var(--r)}.nav i{font-style:normal;font-size:22px}
.fc{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;color:var(--r)}
.fab{width:74px;height:74px;margin-top:-40px;border-radius:50%;border:5px solid var(--w);background:var(--r);font-size:30px;cursor:pointer;animation:rg 2s infinite;transition:transform .2s}.fab:active{transform:scale(.88) rotate(-8deg)}
@keyframes rg{0%{box-shadow:0 0 0 0 rgba(215,19,43,.55)}100%{box-shadow:0 0 0 22px rgba(215,19,43,0)}}
#m{position:fixed;inset:0;background:rgba(43,11,16,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}#m.on{display:flex}
.sheet{background:var(--w);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,1,.3,1)}@keyframes up{from{transform:translateY(100%)}}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border-radius:14px;border:2px solid var(--r);background:var(--w);color:var(--r);font-weight:700;cursor:pointer}.seg button.on{background:var(--r);color:#fff}.seg button:disabled{opacity:.35}
.shot{display:grid;place-items:center;height:170px;margin:14px 0;border:2px dashed var(--r);border-radius:18px;text-align:center;color:var(--r);cursor:pointer;overflow:hidden}.shot img{height:100%;width:100%;object-fit:cover}
.at{display:flex;justify-content:space-between;align-items:center}.ph{display:flex;gap:6px}.ph img,.zi{width:52px;height:52px;object-fit:cover;border-radius:12px;border:2px solid var(--r);cursor:pointer}.zi{width:100%;height:auto;max-height:70vh}
.st{display:grid;gap:8px}.stp{display:flex;align-items:center;gap:12px}.stp button,.acts button{border:2px solid var(--r);background:var(--w);color:var(--r);border-radius:10px;padding:4px 12px;font-weight:700;cursor:pointer}.acts{display:flex;gap:8px}
.st small{display:block}.pcs{display:flex;flex-wrap:wrap;gap:6px}.pc{border:2px solid var(--r);background:var(--p);color:var(--r);border-radius:10px;padding:5px 11px;font-weight:700;cursor:pointer}.pc.pl{background:var(--r);color:#fff}
#ins{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 28px);max-width:532px;background:var(--w);color:var(--ink);border-radius:18px;padding:10px 6px 10px 12px;display:none;align-items:center;gap:10px;z-index:8;box-shadow:0 8px 28px rgba(142,10,27,.35);outline:2px dashed rgba(215,19,43,.4);outline-offset:-5px}#ins.on{display:flex;animation:ins .5s cubic-bezier(.2,1,.3,1) both}@keyframes ins{from{opacity:0;transform:translate(-50%,40px)}}#ins img{width:42px;height:42px;border-radius:10px;object-fit:contain}#ins div{flex:1;line-height:1.15}#ins small{display:block}
.empty{text-align:center;color:var(--mut);padding:28px 16px}
.login{max-width:380px;margin:auto;padding:40px 20px;text-align:center;background:var(--r);min-height:100vh;color:#fff;animation:in .6s}
.login .logo{width:124px;height:124px;border-radius:28px;margin:20px auto;font-size:40px;animation:bn 2.4s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-12px) rotate(4deg)}}
.login h1{font-size:38px;line-height:1;margin:0 0 6px;font-weight:800}.login .card{color:var(--ink);text-align:left;margin:22px 0}.login .card.sh{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#le{color:var(--r);font-weight:600;min-height:20px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--p);padding:10px 18px;border-radius:99px;z-index:20;animation:in .3s;max-width:90%}
.cf{position:fixed;top:-12px;width:10px;height:14px;border:1px solid var(--r);z-index:30;animation:fl 1.5s ease-in forwards}@keyframes fl{to{transform:translate(var(--dx),105vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

return`<div class="card"><label style="margin:0">Pilih bulan<input type="month" value="${mo}" onchange="V.mon=this.value||V.mon;R()"></label><h3 style="margin-top:14px">Rekap bulanan</h3>${us.map(u=>`<div class="row sp"><b>${E(u)}</b><span>${rows.filter(r=>r.u==u).length} hari hadir</span></div>`).join('')||'<small>Belum ada absensi di bulan ini.</small>'}</div>`+rows.map(r=>`<div class="card at"><div><b>${fd(r.date)}</b><br><small>${E(r.u)}</small><p>Masuk ${r.in.t}, pulang ${r.out?r.out.t:'belum'}</p></div><div class="ph">${img(r.in.img)}${r.out?img(r.out.img):''}</div></div>`).join('')}
function more(){return`<h3 class="sec">Lain-lain</h3><small style="margin:0 20px;display:block">History absensi dan rekap bulanan</small>${absV()}`}
function absen(){const my=S.att.find(x=>x.u==S.user&&x.date==today());AB={my,type:my?(my.out?null:'out'):'in',img:''};absH()}
function absH(){const m=AB.my;modal(`<h3>Absensi ${fd(today())}</h3>`+(m&&m.out?`<p>Masuk ${m.in.t} dan pulang ${m.out.t} sudah tercatat.</p><div class="row"><button class="btn" onclick="mc()">Tutup</button></div>`:`<div class="seg"><button class="${AB.type=='in'?'on':''}" ${m?'disabled':''} onclick="AB.type='in';absH()">Absen masuk</button><button class="${AB.type=='out'?'on':''}" ${m?'':'disabled'} onclick="AB.type='out';absH()">Absen pulang</button></div><label class="shot">${AB.img?`<img src="${AB.img}" alt="Foto absen">`:'<span>📷<br>Ketuk untuk ambil foto</span>'}<input type="file" accept="image/*" capture="user" hidden onchange="ph(this)"></label><div class="row"><button class="btn" onclick="svA()">Simpan absen</button></div>`))}
const ph=i=>i.files[0]&&shot(i.files[0],d=>{AB.img=d;absH()});
function svA(){if(!AB.img)return toast('Ambil foto dulu');const o={t:hm(),img:AB.img};if(AB.type=='in')S.att.push({id:uid(),u:S.user,date:today(),in:o});else AB.my.out=o;save();mc();pop();toast(AB.type=='in'?'Absen masuk tercatat':'Absen pulang tercatat');R()}
const nb=(t,i,l)=>`<button class="${V.tab==t?'on':''}" onclick="go('${t}')"><i>${i}</i>${l}</button>`;
function R(){const a=$('#app');
if(!S.user){a.className='';a.innerHTML=`<div class="login">${logo('big')}<h1>Chinchin<br>Production</h1><p>Masuk untuk mulai kerja</p><div class="card"><label style="margin:0">Username<input id="lu" autocapitalize="off" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label><p id="le"></p><div class="row"><button class="btn" onclick="login()">Masuk</button></div></div></div>`;return}
a.className='app';a.innerHTML=`<header class="top">${logo()}<div class="ttl"><b>Chinchin Production</b><small>Halo, ${E(S.user)}</small></div><button class="ic" onclick="out()">Keluar</button></header><main class="v">${V.tab=='home'?home():V.tab=='proj'?projV():V.tab=='stok'?stokV():more()}</main><nav class="nav">${nb('home','🏠','Home')}${nb('proj','📋','Project')}<div class="fc"><button class="fab" onclick="absen()" aria-label="Absen">📸</button>Absen</div>${nb('stok','📦','Stok')}${nb('more','☰','Lain-lain')}</nav>`}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),isApp=matchMedia('(display-mode: standalone)').matches||navigator.standalone;let DP=null;
const insT=()=>{try{return+localStorage.getItem('ccins')||0}catch(e){return 0}};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e});
addEventListener('appinstalled',()=>hideIns(1,9e15));
function showIns(){if(isApp||Date.now()<insT())return;const d=$('#ins');d.innerHTML=`<img src="${LOGO}" alt=""><div><b>Pasang aplikasi</b><small>Buka lebih cepat dari layar utama HP</small></div><button class="btn s" onclick="insGo()">Klik di sini</button><button class="x" onclick="hideIns(1)" aria-label="Tutup">×</button>`;d.classList.add('on')}
function hideIns(c,t){$('#ins').classList.remove('on');if(c)try{localStorage.setItem('ccins',t||Date.now()+6048e5)}catch(e){}}
async function insGo(){if(DP){DP.prompt();const r=await DP.userChoice;DP=null;if(r.outcome=='accepted')hideIns(1,9e15);return}
modal(`<h3>Pasang aplikasi</h3><p>${isIOS?'Ketuk tombol <b>Bagikan</b> di Safari, lalu pilih <b>Tambah ke Layar Utama</b>.':'Buka menu browser (titik tiga di pojok), lalu pilih <b>Pasang aplikasi</b> atau <b>Tambahkan ke layar utama</b>.'}</p><div class="row"><button class="btn" onclick="mc()">Mengerti</button></div>`)}
setTimeout(showIns,2500);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{if(ON){const{data}=await sb.auth.getSession();if(data.session){S.user=data.session.user.email.split('@')[0];return start()}}R()})();
document.addEventListener('visibilitychange',()=>{if(ON&&S.user&&!document.hidden&&!$('#m').classList.contains('on'))Q=Q.then(pull).then(R).catch(()=>{})});
</script></body></html>
